<!DOCTYPE html>
<html lang="{cr_lang}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<title>{cr_title}</title>
<style type="text/css">
  body { margin:0; padding:0; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
  table { border-collapse:collapse; mso-table-lspace:0; mso-table-rspace:0; }
  img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
  a { color:#1f1f1f; }
  @media only screen and (max-width: 620px) {
    .cr-outer { padding:0 !important; }
    .cr-wrap { width:100% !important; border-radius:0 !important; }
    .cr-pad { padding-left:20px !important; padding-right:20px !important; }
    .cr-title { font-size:21px !important; }
    .cr-hero { width:100% !important; height:auto !important; }
    .cr-pcol { display:none !important; }
    .cr-pm { display:block !important; max-height:none !important; overflow:visible !important; }
    .cr-col { display:block !important; width:100% !important; padding-left:0 !important; padding-right:0 !important; }
    .cr-hide-m { display:none !important; }
    .cr-reas-td { display:block !important; width:100% !important; padding:6px 0 !important; text-align:left !important; }
    .cr-stack { display:block !important; width:100% !important; text-align:left !important; }
  }
</style>
<!--[if mso]><style type="text/css">body, table, td, p, a { font-family: Arial, sans-serif !important; }</style><![endif]-->
</head>
<body style="margin:0;padding:0;background:#f3f3f3;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;">{cr_preheader}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f3f3;">
  <tr>
    <td class="cr-outer" align="center" style="padding:28px 12px;">
      <table role="presentation" class="cr-wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#ffffff;">
        <tr>
          <td align="center" bgcolor="{cr_header_bg}" style="background:{cr_header_bg};padding:14px 0;">
            <a href="{shop_url}" target="_blank"><img src="{shop_logo}" height="64" alt="{shop_name}" style="display:block;height:64px;width:auto;max-width:220px;border:0;"></a>
          </td>
        </tr>
        <tr>
          <td style="padding:0;font-size:0;line-height:0;"><a href="{shop_url}" target="_blank"><img class="cr-hero" src="{cr_hero}" width="600" alt="{shop_name}" style="display:block;width:600px;max-width:100%;height:auto;"></a></td>
        </tr>
        <tr>
          <td align="center" bgcolor="{cr_accent}" class="cr-pad" style="background:{cr_accent};padding:18px 32px;">
            <h1 class="cr-title" style="margin:0;font-family:Tahoma,Arial,sans-serif;font-size:24px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:{cr_accent_text};">{cr_title}</h1>
          </td>
        </tr>
        <tr>
          <td class="cr-pad" style="padding:28px 32px 6px;font-family:Tahoma,Arial,sans-serif;font-size:15px;line-height:1.65;color:#2a2a2a;">
            {cr_body}
          </td>
        </tr>
        <tr><td>{cr_reassurance}</td></tr>
        <tr>
          <td align="center" bgcolor="{cr_header_bg}" style="background:{cr_header_bg};padding:22px 32px;font-family:Tahoma,Arial,sans-serif;font-size:12px;line-height:1.7;color:{cr_header_text};">
            <div style="font-size:14px;font-weight:bold;">{shop_name}{cr_tagline_sep}</div>
            <div><a href="{shop_url}" target="_blank" style="color:{cr_header_text};">{cr_shop_domain}</a> · <a href="mailto:{cr_shop_email}" style="color:{cr_header_text};">{cr_shop_email}</a></div>
            <div style="margin-top:8px;opacity:.75;">{cr_footer}</div>
            <div style="margin-top:6px;opacity:.75;"><a href="{cr_unsub_url}" target="_blank" style="color:{cr_header_text};">{cr_unsub_label}</a></div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
{cr_pixel_tag}
</body>
</html>
